name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Numéro de version
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Tests unitaires et APK signé
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Nommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk "bruce-companion-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: bruce-companion-apk
          path: bruce-companion-*.apk

      # Chaque push sur main publie (ou met à jour) la release correspondant au fichier VERSION.
      - name: Publier la release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Bruce Companion ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: bruce-companion-*.apk
          generate_release_notes: true
          make_latest: true
